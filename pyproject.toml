[project]
name = "entity-scrub"
version = "0.1.0"
description = "Local tool to detect real entities in CSV/XLSX/DOCX/PDF files and replace them with consistent fakes"
requires-python = ">=3.11,<3.13"
dependencies = [
  "gliner>=0.2.16,<0.3",
  "torch>=2.3",
  "faker>=30",
  "phonenumbers>=8.13",
  "cryptography>=43",
  "lxml>=5",
  "pymupdf>=1.24,<1.27",
  "pdfminer.six>=20240706",
  "charset-normalizer>=3",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "streamlit>=1.38",
  "requests>=2.32",
  "pandas>=2.2",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "openpyxl>=3.1", "python-docx>=1.1"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: uses the real GLiNER model"]
addopts = "-m 'not slow'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scrub", "backend"]
